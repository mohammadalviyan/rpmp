version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "db/migrations/000001_auth.up.sql"
      - "db/migrations/000002_operational.up.sql"
      - "db/migrations/000003_aggregate_snapshots.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/repo/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
